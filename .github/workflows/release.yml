name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Ensure package.json, tauri.conf.json and Cargo.toml versions match the tag
        run: bun run scripts/check-version.ts "${GITHUB_REF_NAME}"

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - platform: ubuntu-24.04
            args: "--bundles deb,appimage,rpm"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev cmake pkg-config libssl-dev \
            libasound2-dev libevdev-dev libxdo-dev libxtst-dev libxi-dev libx11-dev \
            libvulkan-dev vulkan-tools glslc spirv-headers glslang-tools \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-layer-shell-dev patchelf

      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: false
          # The stripped/cached SDK is missing Lib\vulkan-1.lib, which the linker needs.
          cache: false
          stripdown: false

      - name: Check Vulkan import library
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VULKAN_SDK\Lib\vulkan-1.lib")) { Write-Error "vulkan-1.lib not found under $env:VULKAN_SDK\Lib"; exit 1 }
          "VULKAN_SDK=$env:VULKAN_SDK (vulkan-1.lib present)"

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Self-signed (free) code-signing identity: unlike ad-hoc signing, its designated requirement is
      # tied to the certificate rather than the build hash, so macOS keeps Accessibility/permissions
      # across updates. Replace with a Developer ID certificate + notarization later.
      - name: Import self-signed macOS code-signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/babbl-signing.keychain-db"
          KCPW="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "Babbl Self-Signed Code Signing" -p "$KC" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          if ! security find-identity -v -p codesigning | grep -q "Babbl Self-Signed Code Signing"; then
            echo "::error::Babbl signing identity is not valid for code signing"
            security find-identity -p codesigning
            exit 1
          fi

      - name: Build, sign and publish release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && 'Babbl Self-Signed Code Signing' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Babbl ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
