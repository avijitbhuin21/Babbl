name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS (Apple Silicon)
            os: macos-latest
          - name: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev cmake pkg-config libssl-dev \
            libasound2-dev libevdev-dev libxdo-dev libxtst-dev libxi-dev libx11-dev \
            libvulkan-dev vulkan-tools glslc spirv-headers glslang-tools \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-layer-shell-dev patchelf

      # transcribe-cpp builds transcribe.cpp/ggml with the Vulkan backend on Windows (needs the SDK headers + glslc).
      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: false
          cache: true
          stripdown: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: test

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Also produces ../dist, which tauri::generate_context! needs at compile time.
      - name: Type-check and build frontend
        run: bun run build

      - name: Start local clipboard relay for end-to-end tests
        if: runner.os == 'Linux'
        run: |
          cd relay
          npm ci --omit=dev
          PORT=8787 nohup node server.mjs > relay.log 2>&1 &
          echo "BABBL_TEST_RELAY=ws://127.0.0.1:8787" >> "$GITHUB_ENV"

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib --locked
